[project]
name = "dvf-text-to-sql-api"
version = "0.1.0"
description = "Text-to-SQL over French property sales (DVF, Gironde), scored on dvf-text-to-sql-eval"
authors = [
    { name = "Mariot Tsitoara", email = "mariot.tsitoara@filigran.io" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=1.13.0",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "sqlglot>=30.22.0",
]

[project.scripts]
dvf-sql = "dvf_sql.cli:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dvf_sql"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["runs"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
